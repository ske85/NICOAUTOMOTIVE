name: Sincronizza con Subito
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Solo prova (nessuna modifica)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
concurrency: sync-subito
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - name: Prova lettura
        if: inputs.test
        run: |
          python .github/sync.py --test https://www.subito.it/auto/fiat-500l-1-3-multijet-85-cv-lounge-bari-668070044.htm
          python .github/sync.py --dry
      - name: Sincronizza
        id: sync
        if: ${{ !inputs.test }}
        run: python .github/sync.py
      - name: Commit e pubblica
        if: steps.sync.outputs.msg
        env:
          MSG: ${{ steps.sync.outputs.msg }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name ske85
          git config user.email ske85@users.noreply.github.com
          git add -A index.html llms.txt sitemap.xml img
          git commit -q -m "$MSG"
          git push
          gh api -X POST repos/${{ github.repository }}/pages/builds || true
